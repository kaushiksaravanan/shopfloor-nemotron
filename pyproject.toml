[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shopfloor-nemotron"
version = "0.1.0"
description = "Nemotron 3 Nano finetune that turns code-mixed Hinglish/Tamil shop-floor complaints into BIS-cited, HSN-tagged, SAP-PM-ready RCA tickets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kaushik Saravanan", email = "kaushik.saravanan@sap.com" },
    { name = "Achintya Mandal", email = "achintya.mandal@sap.com" },
    { name = "Varun Upreti", email = "varun.upreti@sap.com" },
]
keywords = [
    "nemotron",
    "nemo",
    "lora",
    "grpo",
    "manufacturing",
    "hinglish",
    "bis",
    "hsn",
    "sap-pm",
    "jetson",
    "tensorrt-llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "transformers>=4.46",
    "datasets>=2.20",
    "peft>=0.12",
    "accelerate>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "wandb>=0.18",
    "huggingface_hub>=0.25",
    "rich>=13.9",
    "typer>=0.12",
    "jsonschema>=4.23",
    "tqdm>=4.66",
    "jinja2>=3.1",
    "openai>=1.50",
    "langid>=1.1.6",
]

[project.optional-dependencies]
# NOTE: nemo-toolkit (NeMo AutoModel, NeMo RL, NeMo Curator, NeMo Data Designer,
# TensorRT-Model-Optimizer, TensorRT-LLM) MUST be installed separately against a
# CUDA-matched wheel. See `make setup`. Do not list it here — pip on a CPU host
# will resolve the wrong artifact.
train = [
    "bitsandbytes>=0.43; sys_platform == 'linux'",
    "sentencepiece>=0.2",
    "tokenizers>=0.20",
]
serve = [
    "httpx>=0.27",
    "orjson>=3.10",
    "prometheus-client>=0.21",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/sap-labs-india/shopfloor-nemotron"
Issues = "https://github.com/sap-labs-india/shopfloor-nemotron/issues"
Experiments = "https://github.com/sap-labs-india/shopfloor-nemotron/blob/main/EXPERIMENTS.md"

[project.scripts]
shopfloor = "shopfloor_nemotron.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shopfloor_nemotron"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["outputs", "checkpoints", "wandb", "data/raw", "data/synthetic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that hit a GPU or download a model",
    "integration: marks tests that need a running NeMo Gym server",
]

[tool.coverage.run]
branch = true
source = ["src/shopfloor_nemotron"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
